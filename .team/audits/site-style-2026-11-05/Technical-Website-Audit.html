<script>
'use strict';
const D=JSON.parse(document.getElementById('audit-data').textContent);
const FINGERPRINT='48095b762f785fad8c030e06';
const $=s=>document.querySelector(s), own=(o,k)=>Object.prototype.hasOwnProperty.call(o,k);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STATUS={todo:'To do',doing:'In progress',qa:'Ready for QA',verified:'Verified',review:'Needs review',blocked:'Blocked',deferred:'Deferred','not-needed':'No change needed'};
const EVIDENCE={confirmed:'Confirmed',unverified:'Unverified',blocked:'Blocked',review:'Review candidate'};
const ICONS={list:'<path d="M8 6h12M8 12h12M8 18h12"/><path d="M3 6h.01M3 12h.01M3 18h.01"/>',layers:'<path d="m12 3 9 5-9 5-9-5 9-5Zm-9 9 9 5 9-5M3 16l9 5 9-5"/>',link:'<path d="m10 13 4-4M8 16l-1 1a4 4 0 0 1-6-6l4-4a4 4 0 0 1 6 0M13 17a4 4 0 0 0 6 0l4-4a4 4 0 0 0-6-6l-1 1" transform="translate(0 -1) scale(.95)"/>',image:'<rect x="3" y="3" width="18" height="18" rx="1"/><circle cx="8" cy="8" r="1.5"/><path d="m3 17 5-5 4 4 4-6 5 7"/>',steps:'<path d="M3 19h6v-6h6V7h6M3 19v-3M21 7V4"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/>',download:'<path d="M12 3v12m-4-4 4 4 4-4M4 16v5h16v-5"/>',upload:'<path d="M12 16V4m-4 4 4-4 4 4M4 16v5h16v-5"/>',print:'<path d="M6 9V3h12v6M6 17H3V9h18v8h-3M6 14h12v7H6zM17 11h.01"/>',arrow:'<path d="M4 12h16m-6-6 6 6-6 6"/>',back:'<path d="M20 12H4m6-6-6 6 6 6"/>',external:'<path d="M14 3h7v7M21 3l-9 9M10 3H3v18h18v-7"/>',close:'<path d="m6 6 12 12M18 6 6 18"/>',copy:'<rect x="8" y="8" width="13" height="13" rx="1"/><path d="M16 8V3H3v13h5"/>',search:'<circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/>'};
function ico(k){return '<svg viewBox="0 0 24 24" aria-hidden="true">'+(ICONS[k]||ICONS.info)+'</svg>';}
document.querySelectorAll('[data-icon]').forEach(n=>n.innerHTML=ico(n.dataset.icon));
function safeURL(url){try{const u=new URL(url);return ['https:','http:'].includes(u.protocol)&&!u.username&&!u.password?u.href:'';}catch(e){return '';}}
function external(url,label,cls='btn small'){const u=safeURL(url);return u?'<a class="'+esc(cls)+'" href="'+esc(u)+'" target="_blank" rel="noopener noreferrer">'+esc(label)+' '+ico('external')+'</a>':'<span class="small-muted">'+esc(label)+'</span>';}
function pageLink(p){return '<a class="page-link" href="'+esc(safeURL(p.url))+'" target="_blank" rel="noopener noreferrer"><span>'+esc(p.label||p.url)+'<small>'+esc(p.url)+'</small>'+(p.scope?'<small>'+esc(p.scope)+'</small>':'')+'</span>'+ico('external')+'</a>';}
function list(items){return '<ul class="plain-list">'+items.map(s=>'<li>'+esc(s)+'</li>').join('')+'</ul>';}
function badge(x){return '<span class="pill '+esc(x.priority.toLowerCase())+'">'+esc(x.priority)+'</span>';}
function evidenceBadge(x){return '<span class="pill '+esc(x.evidenceState)+'">'+esc(EVIDENCE[x.evidenceState])+'</span>';}
const ids=new Set(D.issues.map(x=>x.id)), motionIds=new Set(D.motion.map(x=>x.id)), linkIds=new Set(D.links.map(x=>x.id));
const storageKey='technical-website-audit:'+D.project.id+':'+D.project.auditId+':'+FINGERPRINT;
function blankState(){return {statuses:Object.create(null),notes:Object.create(null),motion:Object.create(null),links:Object.create(null)};}
function validateState(s){if(!s||typeof s!=='object'||Array.isArray(s))throw Error('Invalid progress state.');const out=blankState();for(const key of Object.keys(s))if(!own(out,key))throw Error('Unknown progress field: '+key);for(const key of Object.keys(out)){const map=s[key]||{};if(typeof map!=='object'||Array.isArray(map))throw Error('Invalid progress field: '+key);for(const [id,value] of Object.entries(map)){const allowed=key==='motion'?motionIds:key==='links'?linkIds:ids;if(!allowed.has(id))throw Error('Progress contains an unknown '+key+' ID.');if(key==='statuses'){if(typeof value!=='string'||!own(STATUS,value))throw Error('Invalid task status.');}else if(key==='notes'){if(typeof value!=='string'||value.length>10000)throw Error('Notes must be text under 10,000 characters.');}else if(typeof value!=='boolean')throw Error('Checks must be true or false.');out[key][id]=value;}}return out;}
function validateExport(x){if(!x||x.format!=='technical-website-audit-progress'||x.version!==1||x.projectId!==D.project.id||x.auditId!==D.project.auditId||x.datasetFingerprint!==FINGERPRINT)throw Error('This progress file belongs to a different project or audit snapshot.');return validateState(x.state);}
let state=blankState(),storageOK=true,currentView='issues',currentIssue=null,returnFocus='',page=1;
try{const saved=localStorage.getItem(storageKey);if(saved)state=validateExport(JSON.parse(saved));}catch(e){storageOK=false;}
function progressByteLimit(){return 5*1024*1024+D.issues.length*61000+(D.motion.length+D.links.length)*256;}
function exportObject(){return {format:'technical-website-audit-progress',version:1,projectId:D.project.id,auditId:D.project.auditId,datasetFingerprint:FINGERPRINT,exportedAt:new Date().toISOString(),state};}
function save(){try{localStorage.setItem(storageKey,JSON.stringify(exportObject()));storageOK=true;$('#saveState').textContent='Saved in this browser';}catch(e){storageOK=false;$('#saveState').textContent='Browser storage unavailable · export progress';}}
let toastTimer;function toast(message){clearTimeout(toastTimer);$('#toast').textContent=message;$('#toast').hidden=false;toastTimer=setTimeout(()=>$('#toast').hidden=true,5000);}
function statusOf(x){return state.statuses[x.id]||x.status;}
function isDone(x){return ['verified','not-needed'].includes(statusOf(x));}
function options(value){return Object.entries(STATUS).map(([k,v])=>'<option value="'+esc(k)+'"'+(k===value?' selected':'')+'>'+esc(v)+'</option>').join('');}
function metrics(){const done=D.issues.filter(isDone).length,p1=D.issues.filter(x=>['P0','P1'].includes(x.priority)&&!isDone(x)).length;$('#metrics').innerHTML=[['Tracked tasks',D.issues.length,'Authoritative findings in this snapshot'],['Marked complete',done,'Your checklist status · '+D.issues.length+' total'],['Urgent tasks open',p1,'P0 / P1 not marked complete'],['Motion inventory rows',D.motion.length,'Use each row’s scope and target count']].map(([label,value,caption])=>'<div class="metric"><span>'+esc(label)+'</span><strong style="margin-top:6px">'+value+'</strong><span>'+esc(caption)+'</span>'+(label==='Marked complete'?'<div class="progress-track"><div class="progress-fill" style="width:'+(D.issues.length?100*done/D.issues.length:0)+'%"></div></div>':'')+'</div>').join('');}
function query(){return $('#query').value.trim().toLowerCase();}
function empty(){return '<div class="empty"><h3>No matching records</h3><p>Try another term or clear the filters.</p><button class="btn" data-clear>Clear filters</button></div>';}
function paged(rows){const pages=Math.max(1,Math.ceil(rows.length/60));page=Math.min(page,pages);return {rows:rows.slice((page-1)*60,page*60),nav:rows.length>60?'<div class="pager"><span class="small-muted">Page '+page+' of '+pages+' · '+rows.length+' records</span><div><button class="btn small" data-page="'+(page-1)+'"'+(page===1?' disabled':'')+'>'+ico('back')+' Previous</button> <button class="btn small" data-page="'+(page+1)+'"'+(page===pages?' disabled':'')+'>Next '+ico('arrow')+'</button></div></div>':''};}
function matches(x,q){return !q||JSON.stringify(x).toLowerCase().includes(q);}
function filteredIssues(){const q=query(),p=$('#priority').value,b=$('#batch').value,s=$('#statusFilter').value;return D.issues.filter(x=>(!p||x.priority===p)&&(!b||x.batch===b)&&(!s||(s==='open'?!isDone(x):statusOf(x)===s))&&matches(x,q));}
function renderIssues(){const rows=filteredIssues(),chunk=paged(rows);return '<p class="result-count">'+rows.length+' of '+D.issues.length+' tasks · evidence status remains separate from your progress</p><div class="panel"><div class="list-labels"><span>Priority</span><span>Finding and expected benefit</span><span class="page-column">Coverage</span><span class="status-column">Your status</span><span></span></div>'+chunk.rows.map(x=>'<article class="issue-row '+(isDone(x)?'verified':'')+'"><div>'+badge(x)+'<span class="issue-id">'+esc(x.id)+'</span></div><div><button class="issue-title" id="open-'+esc(x.id)+'" data-issue="'+esc(x.id)+'">'+esc(x.title)+'</button><div class="row-caption">'+esc(x.finding)+'</div><div class="row-caption scope">'+esc(x.benefit)+'</div><div class="baseline-label">'+evidenceBadge(x)+(x.userPriority?' <span class="pill purple">User priority</span>':'')+'</div></div><div class="page-column">'+x.pages.length+' linked page'+(x.pages.length===1?'':'s')+'<div class="small-muted">'+esc(x.scope||'See task scope')+'</div></div><div class="status-column"><label class="sr-only" for="status-'+esc(x.id)+'">Status for '+esc(x.id)+'</label><select id="status-'+esc(x.id)+'" class="status-select" data-status="'+esc(x.id)+'">'+options(statusOf(x))+'</select></div><div class="open-column"><button class="open-btn" data-issue="'+esc(x.id)+'" aria-label="Open '+esc(x.id)+'">'+ico('arrow')+'</button></div></article>').join('')+(rows.length?'':empty())+chunk.nav+'</div>';}
function related(ids){return ids.map(id=>'<button class="btn small" data-issue="'+esc(id)+'">Task '+esc(id)+' '+ico('arrow')+'</button>').join(' ');}
function renderMotion(){const rows=D.motion.filter(x=>matches(x,query())),chunk=paged(rows);return '<div class="info">Map actual animated targets and native ownership before changing an effect. A missing trigger match does not prove an unused definition. Keep functional UI state and behaviour intact.</div><div class="panel table-wrap"><table class="route-table"><thead><tr><th scope="col">Checked</th><th scope="col">Page and effect</th><th scope="col">Ownership and scope</th><th scope="col">Next action</th></tr></thead><tbody>'+chunk.rows.map(x=>'<tr class="'+(state.motion[x.id]?'done-route':'')+'"><td><label><input class="check" id="motion-'+esc(x.id)+'" type="checkbox" data-motion="'+esc(x.id)+'"'+(state.motion[x.id]?' checked':'')+'><span class="sr-only">Checked '+esc(x.label)+'</span></label></td><td>'+external(x.url,x.label,'route-name')+'<span class="path">'+esc(x.url)+'</span><span class="pill">'+esc(x.type)+'</span><p>'+esc(x.finding)+'</p></td><td>'+esc(x.owner)+'<span class="path">'+esc(x.engine)+'</span><span class="small-muted">'+(x.targetCount===null?'Target count unmeasured':x.targetCount+' targets')+' · '+esc(x.scope)+'</span><details><summary>Binding and timeline references</summary><p>Triggers: '+esc(x.triggers.join(', ')||'Not recorded')+'<br>Timelines: '+esc(x.timelines.join(', ')||'Not recorded')+'</p></details></td><td>'+esc(x.action)+'<div class="card-actions">'+related(x.issueIds)+'</div></td></tr>').join('')+'</tbody></table>'+(rows.length?'':empty())+chunk.nav+'</div>';}
function renderLinks(){const rows=D.links.filter(x=>matches(x,query())),chunk=paged(rows);return '<div class="info">Check the complete user journey. A blocked automated response is unverified until a browser or authoritative source establishes the outcome. Existing URLs are not to be renamed merely to repair a navigation link.</div><div class="cards">'+chunk.rows.map(x=>'<article class="search-card"><div class="card-head"><div><h3>'+esc(x.label)+'</h3>'+evidenceBadge(x)+' <span class="pill">'+esc(x.response||'Not measured')+'</span></div><label class="inline-check"><input type="checkbox" class="check" data-link-check="'+esc(x.id)+'"'+(state.links[x.id]?' checked':'')+'>Journey checked</label></div><p class="small-muted">'+esc(x.finding)+'</p><div class="url-pair"><div class="url-box"><span class="mini-label">Current destination</span><span class="path">'+esc(x.currentUrl)+'</span><div class="card-actions">'+external(x.currentUrl,'Open current')+(x.sourceUrl?external(x.sourceUrl,'Open source page'):'')+'</div></div><span class="arrow">'+ico('arrow')+'</span><div class="url-box good"><span class="mini-label">'+(x.proposedUrl?'Proposed existing destination':'Review action')+'</span><span class="path">'+esc(x.proposedUrl||x.action)+'</span><div class="card-actions">'+(x.proposedUrl?external(x.proposedUrl,'Open proposed')+'<button class="btn small" data-copy="'+esc(x.proposedUrl)+'">'+ico('copy')+' Copy URL</button>':'')+'</div></div></div><p class="small-muted">'+esc(x.acceptance)+'</p><div class="card-actions">'+related(x.issueIds)+'</div></article>').join('')+(rows.length?'':empty())+chunk.nav+'</div>';}
function bytes(n){return n===null?'Not measured':n>=1000000?(n/1000000).toFixed(2)+' MB':n>=1000?(n/1000).toFixed(1)+' kB':n+' bytes';}
function renderAssets(){const rows=D.assets.filter(x=>matches(x,query())),chunk=paged(rows);return '<div class="info">File size, decoded source size and compressed transfer are different measurements. Do not add them into one saving. Compare actual delivery under equivalent cache, viewport and network conditions after a change.</div><div class="image-grid">'+chunk.rows.map(x=>'<article class="image-card"><div><span class="pill">'+esc(x.kind)+'</span> '+evidenceBadge(x)+'<div class="image-size">'+esc(bytes(x.bytes))+'</div><span class="mini-label">'+esc(x.measurement)+'</span><h3 style="margin-top:18px">'+esc(x.label)+'</h3><span class="path">'+esc(x.dimensions||'')+'</span><p>'+esc(x.finding)+'</p><p><strong>Action:</strong> '+esc(x.action)+'</p><span class="filename">'+esc(x.url)+'</span></div><div class="card-actions">'+external(x.url,'Open asset')+(x.pageUrl?external(x.pageUrl,'Open page'):'')+related(x.issueIds)+'</div></article>').join('')+(rows.length?'':empty())+'</div>'+chunk.nav+'<div class="scope-card" style="margin-top:18px"><h3>Replacement checks</h3>'+list(['Retain the correct subject, crop, meaningful alt text and visual quality.','Check responsive selection at real viewport sizes and device pixel ratios.','Trace ownership and dynamic use before removing an import or embed.','Measure actual bytes after the change; do not promise a performance score from source size alone.'])+'</div>';}
function renderPlan(){return '<div class="info purple">'+esc(D.project.changePolicy)+'</div><div class="plan-grid">'+D.batches.map(b=>{const items=D.issues.filter(x=>x.batch===b.id),done=items.filter(isDone).length;return '<article class="batch-card"><span class="batch-number">'+esc(b.id)+'</span><div><h3>'+esc(b.title)+'</h3><p>'+esc(b.description)+'</p><span class="pill '+(done===items.length&&items.length?'good':'')+'">'+done+' / '+items.length+' marked complete</span>'+list(b.checks)+'</div><button class="btn" data-batch="'+esc(b.id)+'">Open batch '+ico('arrow')+'</button></article>';}).join('')+'</div><div class="scope-card" style="margin-top:16px"><h3>Verification and protected behaviour</h3>'+list(D.guardrails)+'</div>';}
function renderScope(){return '<div class="scope-grid"><div class="scope-card"><h3>Coverage and method</h3><table class="stat-table"><tbody>'+D.coverage.map(x=>'<tr><td>'+esc(x.label)+(x.method?'<div class="small-muted">'+esc(x.method)+'</div>':'')+'</td><td>'+esc(x.value)+'</td></tr>').join('')+'</tbody></table></div><div class="scope-card"><h3>Use and back up this tracker</h3>'+list(['Open a task for its evidence, affected pages, expected benefit and completion checks.','Your statuses and notes are stored only in this browser when storage is available.','Export progress to keep a backup or move between browsers. Import accepts this exact project and audit snapshot.','The file makes no automatic network requests. A destination opens only when you select its link.','Marking a task complete does not edit the site or establish that a check was performed. Record the actual result in your project work log.'])+'</div><div class="scope-card"><h3>Scope and limitations</h3><p>'+esc(D.project.scope)+'</p>'+list(D.limitations)+'</div><div class="scope-card"><h3>Evidence and project files</h3><p>Audit date: '+esc(D.project.auditDate)+' · '+esc(D.project.environment)+' · '+esc(D.project.mode)+'</p><div class="scope-links">'+D.files.map(x=>external(x.url,x.label)).join('')+'</div><p>'+esc(D.project.changePolicy)+'</p></div></div>';}
const VIEWS={issues:['Fix list','Prioritised findings with evidence, expected benefit and completion checks.',renderIssues],motion:['Motion inventory','Native ownership, actual targets and a per-row check.',renderMotion],links:['Link checks','Source, current destination, supported repair and journey check.',renderLinks],assets:['Asset review','Measured sizes, ownership and direct inspection links.',renderAssets],plan:['Work order','Bounded batches and protected behaviour.',renderPlan],scope:['Audit & evidence','Coverage, limitations and supporting files.',renderScope]};
function render(){metrics();$('#view').innerHTML=VIEWS[currentView][2]();}
function setView(name,reset=true){if(!own(VIEWS,name))name='issues';currentView=name;page=1;if(reset){$('#query').value='';$('#priority').value='';$('#batch').value='';$('#statusFilter').value='';}document.querySelectorAll('[data-view]').forEach(n=>{if(n.dataset.view===name)n.setAttribute('aria-current','page');else n.removeAttribute('aria-current');});$('#viewTitle').textContent=VIEWS[name][0];$('#viewDesc').textContent=VIEWS[name][1];$('#toolbar').classList.toggle('hidden',['plan','scope'].includes(name));['priority','batch','statusFilter'].forEach(id=>$('#'+id).classList.toggle('hidden',name!=='issues'));$('#exportCsv').classList.toggle('hidden',['plan','scope'].includes(name));render();window.scrollTo({top:0,behavior:'auto'});}
function section(title,body){return '<section class="detail-block"><h3>'+esc(title)+'</h3>'+body+'</section>';}
function taskBody(x){return section('What was found','<p>'+esc(x.finding)+'</p><p class="small-muted">'+esc(x.scope)+'</p>')+section('Why this matters','<p>'+esc(x.benefit)+'</p><p class="small-muted">Priority: '+esc(x.priorityReason)+'</p>')+section('What to change','<p>'+esc(x.action)+'</p>'+list(x.steps))+section('Completion checks',list(x.acceptance))+section('Ownership, risk and rollback','<p><strong>Owner:</strong> '+esc(x.owner)+'</p><p><strong>Risk:</strong> '+esc(x.risk)+'</p><p><strong>Rollback:</strong> '+esc(x.rollback)+'</p>')+section('Linked pages','<div class="page-links">'+x.pages.map(pageLink).join('')+'</div>')+section('Evidence',x.evidence.map(e=>'<div class="evidence-line"><strong>'+esc(e.label)+'</strong><p>'+esc(e.detail)+'</p>'+(e.checkedAt?'<span class="small-muted">'+esc(e.checkedAt)+'</span>':'')+(e.url?'<div>'+external(e.url,'Open evidence')+'</div>':'')+'</div>').join(''))+(x.verification.length?section('Recorded verification',x.verification.map(v=>'<div class="evidence-line"><span class="pill '+(v.result==='passed'?'good':'')+'">'+esc(v.result)+'</span> <strong>'+esc(v.check)+'</strong><p>'+esc(v.detail)+'</p></div>').join('')):'');}
function openIssue(id){const x=D.issues.find(y=>y.id===id);if(!x)return;const dlg=$('#issueDialog');if(!dlg.open)returnFocus=document.activeElement?.id||'open-'+id;currentIssue=id;const index=D.issues.indexOf(x);dlg.innerHTML='<header class="dialog-header"><div>'+badge(x)+' '+evidenceBadge(x)+'<span class="result-count"> '+esc(x.id)+' · Batch '+esc(x.batch)+'</span><h2 id="dialogTitle" tabindex="-1">'+esc(x.title)+'</h2></div><button class="btn quiet" data-close aria-label="Close task">'+ico('close')+'</button></header><div class="dialog-body"><div class="detail-grid"><div>'+taskBody(x)+'</div><aside class="detail-side">'+section('Your task status','<label class="sr-only" for="dialogStatus">Task status</label><select id="dialogStatus" class="status-select" data-status="'+esc(id)+'">'+options(statusOf(x))+'</select><p>Authoritative audit status: '+esc(STATUS[x.status])+'. Your choice records progress only.</p>')+section('Your notes','<label class="sr-only" for="taskNotes">Task notes</label><textarea id="taskNotes" class="notes" data-notes="'+esc(id)+'" maxlength="10000" placeholder="What changed, actual checks, remaining limits…">'+esc(state.notes[id]??x.notes)+'</textarea>')+section('Project scope','<p>'+esc(D.project.changePolicy)+'</p>')+'</aside></div></div><footer class="dialog-footer"><div><button class="btn" data-copy-task="'+esc(id)+'">'+ico('copy')+' Copy task</button><button class="btn" data-print-task="'+esc(id)+'">'+ico('print')+' Print</button></div><div><button class="btn" data-issue="'+esc(D.issues[index-1]?.id||'')+'"'+(index===0?' disabled':'')+' aria-label="Previous task">'+ico('back')+'</button><button class="btn primary" data-issue="'+esc(D.issues[index+1]?.id||'')+'"'+(index===D.issues.length-1?' disabled':'')+'>Next task '+ico('arrow')+'</button></div></footer>';if(!dlg.open)dlg.showModal();$('#dialogTitle').focus();dlg.scrollTop=0;}
function closeIssue(){if($('#issueDialog').open)$('#issueDialog').close();}
$('#issueDialog').addEventListener('close',()=>{if(returnFocus)document.getElementById(returnFocus)?.focus();currentIssue=null;});
function taskText(x){return [x.id+' · '+x.title,'Priority: '+x.priority+' Not recorded '+x.priorityReason,'Evidence: '+EVIDENCE[x.evidenceState],'\nFinding\n'+x.finding,'\nBenefit\n'+x.benefit,'\nAction\n'+x.action,...x.steps.map((s,i)=>(i+1)+'. '+s),'\nAcceptance\n'+x.acceptance.map(s=>'• '+s).join('\n'),'\nPages\n'+x.pages.map(p=>p.url).join('\n'),'\nRollback\n'+x.rollback,'\n'+D.project.changePolicy].join('\n');}
async function copyText(value){try{await navigator.clipboard.writeText(value);toast('Copied.');}catch(e){const t=document.createElement('textarea');t.value=value;t.style.cssText='position:fixed;left:-9999px';($('#issueDialog').open?$('#issueDialog'):document.body).append(t);t.select();let ok=false;try{ok=document.execCommand('copy');}catch(e){}t.remove();toast(ok?'Copied.':'Copy is unavailable. Select the visible text instead.');}}
function download(name,text,type){const blob=new Blob([text],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);}
function csvCell(v){let s=String(v??'');if(/^\s*[=+\-@]/.test(s)||/^[\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';}
function exportCSV(){let rows;if(currentView==='motion')rows=[['ID','Page','Type','Owner','Engine','Targets','Scope','Triggers','Timelines','Finding','Action','Checked'],...D.motion.map(x=>[x.id,x.url,x.type,x.owner,x.engine,x.targetCount,x.scope,x.triggers.join('; '),x.timelines.join('; '),x.finding,x.action,state.motion[x.id]?'Yes':'No'])];else if(currentView==='links')rows=[['ID','Label','Evidence','Source','Current','Proposed','Response','Finding','Action','Acceptance','Checked'],...D.links.map(x=>[x.id,x.label,x.evidenceState,x.sourceUrl,x.currentUrl,x.proposedUrl,x.response,x.finding,x.action,x.acceptance,state.links[x.id]?'Yes':'No'])];else if(currentView==='assets')rows=[['ID','Label','Evidence','Asset','Page','Kind','Bytes','Measurement','Finding','Action'],...D.assets.map(x=>[x.id,x.label,x.evidenceState,x.url,x.pageUrl,x.kind,x.bytes,x.measurement,x.finding,x.action])];else rows=[['ID','Priority','Priority rationale','Batch','Task','Evidence','Audit status','Your status','Benefit','Finding','Action','Acceptance','Owner','Rollback','Pages','Notes'],...D.issues.map(x=>[x.id,x.priority,x.priorityReason,x.batch,x.title,x.evidenceState,STATUS[x.status],STATUS[statusOf(x)],x.benefit,x.finding,x.action,x.acceptance.join('; '),x.owner,x.rollback,x.pages.map(p=>p.url).join('; '),state.notes[x.id]??x.notes])];download(D.project.id+'-'+D.project.auditId+'-'+currentView+'.csv','\uFEFF'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8');toast('CSV exported.');}
function printReport(issueId){let html='<h1>'+esc(D.project.name)+' · '+(issueId?'Task detail':esc(VIEWS[currentView][0]))+'</h1><p>'+esc(D.project.auditDate)+' · '+esc(D.project.scope)+'</p>';if(issueId){const x=D.issues.find(x=>x.id===issueId);html+='<article><h2>'+esc(x.id)+' · '+esc(x.title)+'</h2>'+taskBody(x)+'<h3>Your checklist status</h3><p>'+esc(STATUS[statusOf(x)])+'</p><h3>Your notes</h3><p>'+esc(state.notes[x.id]??x.notes)+'</p></article>';}else if(currentView==='issues'){html+=filteredIssues().map(x=>'<article><h2>'+esc(x.id)+' · '+esc(x.title)+'</h2><p>'+esc(x.priority)+' · '+esc(EVIDENCE[x.evidenceState])+' · Your status: '+esc(STATUS[statusOf(x)])+'</p>'+taskBody(x)+'<h3>Your notes</h3><p>'+esc(state.notes[x.id]??x.notes)+'</p></article>').join('');}else html+=$('#view').innerHTML;$('#printReport').innerHTML=html;document.body.classList.add('printing');window.print();setTimeout(()=>document.body.classList.remove('printing'),1000);}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-view'))return setView(b.dataset.view);if(b.hasAttribute('data-issue'))return openIssue(b.dataset.issue);if(b.hasAttribute('data-close'))return closeIssue();if(b.hasAttribute('data-copy'))return copyText(b.dataset.copy);if(b.hasAttribute('data-copy-task'))return copyText(taskText(D.issues.find(x=>x.id===b.dataset.copyTask)));if(b.hasAttribute('data-print-task'))return printReport(b.dataset.printTask);if(b.hasAttribute('data-batch')){setView('issues');$('#batch').value=b.dataset.batch;render();return;}if(b.hasAttribute('data-page')){page=Math.max(1,Number(b.dataset.page));render();$('#viewTitle').scrollIntoView({block:'start'});return;}if(b.hasAttribute('data-clear'))setView(currentView);});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.status&&ids.has(t.dataset.status)&&own(STATUS,t.value)){state.statuses[t.dataset.status]=t.value;save();render();if(!$('#issueDialog').open)document.getElementById('status-'+t.dataset.status)?.focus();}if(t.dataset.motion&&motionIds.has(t.dataset.motion)){state.motion[t.dataset.motion]=t.checked;const id=t.id;save();render();document.getElementById(id)?.focus();}if(t.dataset.linkCheck&&linkIds.has(t.dataset.linkCheck)){state.links[t.dataset.linkCheck]=t.checked;save();}});
document.addEventListener('input',e=>{const id=e.target.dataset.notes;if(id&&ids.has(id)){state.notes[id]=e.target.value.slice(0,10000);save();}});
$('#query').addEventListener('input',()=>{page=1;render();});['priority','batch','statusFilter'].forEach(id=>$('#'+id).addEventListener('change',()=>{page=1;render();}));
$('#startNext').addEventListener('click',()=>{const x=D.issues.find(x=>['todo','doing','qa'].includes(statusOf(x)));if(x)openIssue(x.id);else toast('No actionable task remains. Review blocked, deferred or unverified items separately.');});
$('#exportCsv').addEventListener('click',exportCSV);$('#printView').addEventListener('click',()=>printReport());
$('#exportProgress').addEventListener('click',()=>{download(D.project.id+'-'+D.project.auditId+'-progress.json',JSON.stringify(exportObject(),null,2),'application/json');toast('Progress exported for this audit snapshot.');});
$('#importProgress').addEventListener('click',()=>$('#importFile').click());
$('#importFile').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const limit=progressByteLimit();if(f.size>limit)throw Error('The progress file is larger than this audit permits.');const next=validateExport(JSON.parse(await f.text()));for(const key of Object.keys(state))Object.assign(state[key],next[key]);save();render();toast('Progress imported and merged.');}catch(err){toast(err.message||'The progress file could not be read.');}e.target.value='';});
document.addEventListener('keydown',e=>{if(e.key==='/'&&!$('#issueDialog').open&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)&&!['plan','scope'].includes(currentView)){e.preventDefault();$('#query').focus();}});
window.addEventListener('afterprint',()=>document.body.classList.remove('printing'));
$('#brand').innerHTML=esc(D.project.name)+'<small>Technical audit checklist</small>';
$('#eyebrow').textContent=D.project.environment+' / '+D.project.mode+' / '+D.project.auditDate;
$('#intro').textContent=D.project.intro;
$('#sidebarNote').innerHTML='<span class="pill purple">'+esc(D.project.environment)+'</span><p>Audit snapshot<br><strong style="color:#e4ebee">'+esc(D.project.auditDate)+'</strong></p><p>This report does not edit or publish a website.</p>'+external(D.project.siteUrl,'Open audited site','');
$('#footerNote').textContent=D.project.changePolicy;
$('#batch').innerHTML='<option value="">All batches</option>'+D.batches.map(b=>'<option value="'+esc(b.id)+'">'+esc(b.id+' · '+b.title)+'</option>').join('');
$('#statusFilter').innerHTML='<option value="">All statuses</option><option value="open">Still open</option>'+options('');
document.querySelectorAll('[data-count]').forEach(n=>n.textContent=D[n.dataset.count].length);
if(D.project.demonstration)$('#demo').innerHTML='<div class="demo-note"><strong>Demonstration data.</strong> This synthetic fixture illustrates the tracker. It is not an audit of the example domain.</div>';
if(!storageOK)$('#saveState').textContent='Browser storage unavailable or incompatible · export progress';
setView('issues');
</script>
</body></html>
